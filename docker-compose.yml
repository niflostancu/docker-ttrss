services:
  ttrss:
    image: "niflostancu/ttrss"
    ports:
      - "8080:80"
    environment:
      TTRSS_SELF_URL_PATH: 'http://localhost:8080/'
      # NGINX_SUBPATH: "/rss"
      TTRSS_DB_TYPE: pgsql
      TTRSS_DB_HOST: db
      TTRSS_DB_PORT: 5432
      TTRSS_DB_USER: ttrss
      TTRSS_DB_PASS: ttrss_test_dev123
      TTRSS_DB_NAME: ttrss
  db:
    image: "postgres"
    environment:
      POSTGRES_DB: 'ttrss'
      POSTGRES_USER: 'ttrss'
      POSTGRES_PASSWORD: 'ttrss_test_dev123'
    volumes:
      - db_data:/var/lib/postgresql
      # - ./test-database.sql:/docker-entrypoint-initdb.d/backup.sql

volumes:
  db_data:
    driver_opts:
      type: tmpfs
      device: tmpfs

